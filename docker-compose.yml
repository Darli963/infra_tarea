services:
  
  backend:
    build: ./apps/backend
    container_name: ${BACKEND_CONTAINER_NAME}
    ports:
      - "${BACKEND_PORT}:3001"
    restart: ${RESTART_POLICY}

  frontend:
    build: ./apps/frontend
    container_name: ${FRONTEND_CONTAINER_NAME}
    environment:
      - BACKEND_URL=${BACKEND_URL}
    ports:
      - "${FRONTEND_PORT}:8080"
    depends_on:
      - backend
    restart: ${RESTART_POLICY}

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: ${PROMETHEUS_CONTAINER_NAME}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    restart: ${RESTART_POLICY}

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: ${NODE_EXPORTER_CONTAINER_NAME}
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    restart: ${RESTART_POLICY}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    container_name: ${CADVISOR_CONTAINER_NAME}
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    ports:
      - "${CADVISOR_PORT}:8080"
    restart: ${RESTART_POLICY}

  loki:
    image: grafana/loki:${LOKI_VERSION}
    container_name: ${LOKI_CONTAINER_NAME}
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yaml:ro
    ports:
      - "${LOKI_PORT}:3100"
    restart: ${RESTART_POLICY}

  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    container_name: ${ALLOY_CONTAINER_NAME}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${ALLOY_PORT}:12345"
    depends_on:
      - loki
    restart: ${RESTART_POLICY}

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: ${GRAFANA_CONTAINER_NAME}
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_DEFAULT_THEME=${GF_USERS_DEFAULT_THEME}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
      - loki
    restart: ${RESTART_POLICY}

volumes:
  prometheus-data:
  grafana-data:
